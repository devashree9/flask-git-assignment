<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Page</title>
</head>

<body>

    <h1>To-Do List</h1>

    <form method="POST" action="/submittodoitem">

        <label for="itemName">Item Name:</label>
        <input
            type="text"
            id="itemName"
            name="itemName"
            required
        >

        <br><br>

        <label for="itemDescription">Item Description:</label>
        <textarea
            id="itemDescription"
            name="itemDescription"
            required
        ></textarea>

        <br><br>

        <button type="submit">Submit</button>
        <label for="itemId">Item ID:</label>
       <input type="text" id="itemId" name="itemId" required>
      <br><br>

       <label for="itemUUID">Item UUID:</label>
       <input type="text" id="itemUUID" name="itemUUID" required>
       <br><br>

       <label for="itemHash">Item Hash:</label>
<input type="text" id="itemHash" name="itemHash" required>
<br><br>

    </form>

</body>
</html>
